solid var(--ac);outline-offset:2px}.empty{padding:25px 12px;text-align:center;color:var(--mu)}.empty i{display:block;margin:0 auto 8px;color:var(--or)}.subtle{font-size:12px;color:var(--mu)}

<script>
'use strict';
const SUPABASE_URL = 'https://kplyiweyascwgdapwdzo.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_k4AipUXfHtEjfOJ1Atv5Ng_70GGVqCA';

let supabaseClient = null;
try {
  if (window.supabase && typeof window.supabase.createClient === 'function') {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
} catch (e) {
  console.error('Supabase init failed:', e);
}

let importedTx = [];

async function loadImported() {
  if (!supabaseClient) {
    console.warn('Supabase client not available');
    return;
  }
  try {
    const { data, error } = await supabaseClient
      .from('imported_transactions')
      .select('id, source_app, notification_title, notification_text, amount, direction, transaction_type, captured_at, reviewed')
      .order('captured_at', { ascending: false })
      .limit(100);
    if (error) {
      console.error('Imported transactions error:', error);
      return;
    }
    importedTx = data || [];
    if (view === 'activity') render();
  } catch (e) {
    console.error('loadImported failed:', e);
  }
}

function importedRow(t) {
  const dir = t.direction || 'unknown';
  const dirLabel = dir === 'credit' ? 'Incoming' : dir === 'debit' ? 'Outgoing' : 'Unknown';
  const dirClass = dir === 'credit' ? 'pos' : dir === 'debit' ? 'neg' : '';
  const amt = t.amount != null ? N2(t.amount) : '—';
  const time = t.captured_at ? when(new Date(t.captured_at).getTime()) : '';
  return `<div class="rw">
    <span class="ci">${ic(dir === 'credit' ? 'arrow-down-left' : 'arrow-up-right')}</span>
    <span class="g">
      <b>${esc(t.source_app || 'Unknown')} · ${esc(t.notification_title || 'Notification')}</b>
      <small>${esc(dirLabel)} · ${time}${t.reviewed ? ' · Reviewed' : ''}</small>
      <div class="subtle" style="margin-top:4px">${esc(t.notification_text || '')}</div>
    </span>
    <b class="${dirClass}">${amt}</b>
  </div>`;
}

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));
const STORAGE_KEY='financial-floor-standalone-v1';
const WELCOME_CONFIRMED_KEY='financial-floor-profile-confirmed-v3';
const THEME_KEY='financial-floor-theme';
const MS=[7,30,90,180];
const DEFAULT_WALLETS=[
  {key:'feeding',name:'Feeding',icon:'utensils'},
  {key:'transport',name:'Transport',icon:'bus'},
  {key:'data',name:'Data',icon:'smartphone'}
];
const N=n=>(n<0?'-':'')+'₦'+Math.round(Math.abs(Number(n)||0)).toLocaleString('en-NG');
const N2=n=>'₦'+(Number(n)||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});
const cap=s=>String(s||'').charAt(0).toUpperCase()+String(s||'').slice(1),ic=(n,c)=>`<i data-lucide="${esc(n)}"${c?` class="${esc(c)}"`:''} aria-hidden="true"></i>`;
const DEFAULT_CFG={bareBones:3000,targetDays:180,floorPct:30,waitHours:72,splits:{feeding:50,transport:25,data:25},solo:true};
const BAD=/\$[a-z]{2,}|\b(token|coin|memecoin|pump|dip|ape|ticker|trade|trading|leverage)\b/i;
const NAV=[['home','house','Home'],['wallets','wallet','Wallets'],['activity','activity','Activity'],['goals','target','Floor goals'],['profile','user-round','Profile']];
const WALLET_ICONS=['wallet','circle-dollar-sign','shopping-bag','car','home','heart','book','gift','coffee','music','plane','briefcase','utensils','bus','smartphone','piggy-bank','credit-card','banknote'];

const STATES = ['Abia','Adamawa','Akwa Ibom','Anambra','Bauchi','Bayelsa','Benue','Borno','Cross River','Delta','Ebonyi','Edo','Ekiti','Enugu','Gombe','Imo','Jigawa','Kaduna','Kano','Katsina','Kebbi','Kogi','Kwara','Lagos','Nasarawa','Niger','Ogun','Ondo','Osun','Oyo','Plateau','Rivers','Sokoto','Taraba','Yobe','Zamfara','FCT Abuja'];
const SALARY_RANGES = ['Under ₦50,000','₦50,000 – ₦100,000','₦100,000 – ₦200,000','₦200,000 – ₦500,000','₦500,000 – ₦1,000,000','Above ₦1,000,000','Prefer not to say'];
const INCOME_SOURCES = ['Salary / Employment','Business / Self-employed','Freelance / Contract','Student','Pension / Allowance','Other'];

let state=loadState(),view='home',wd=null,sel=null,filt='all',hide=readHide(),modalKind=null,toastTimer=null,editingProfile=false,confirmProfileOnThisVersion=false,theme=localStorage.getItem(THEME_KEY)||'light';
try{confirmProfileOnThisVersion=!!state.profile?.name&&localStorage.getItem(WELCOME_CONFIRMED_KEY)!=='1'}catch(e){confirmProfileOnThisVersion=!!state.profile?.name}
document.documentElement.setAttribute('data-theme',theme);

function getWallets(){return state.wallets&&state.wallets.length?state.wallets:DEFAULT_WALLETS}
function getWallet(key){return getWallets().find(w=>w.key===key)||{key,name:cap(key),icon:'wallet'}}
function getBudget(key){return (state.budgets&&state.budgets[key])||0}
function freshState(){return{version:1,profile:null,wallets:[...DEFAULT_WALLETS],budgets:{},cfg:{...DEFAULT_CFG,splits:{...DEFAULT_CFG.splits}},ledger:[],requests:[],notes:[]}}
function loadState(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return freshState();const x=JSON.parse(raw);if(!x||typeof x!=='object')return freshState();const d=freshState();const wallets=Array.isArray(x.wallets)&&x.wallets.length?x.wallets:DEFAULT_WALLETS;return{...d,...x,wallets,budgets:x.budgets||{},cfg:x.cfg?{...DEFAULT_CFG,...x.cfg,splits:{...DEFAULT_CFG.splits,...(x.cfg.splits||{})}}:d.cfg,profile:x.profile||null,ledger:Array.isArray(x.ledger)?x.ledger:[],requests:Array.isArray(x.requests)?x.requests:[],notes:Array.isArray(x.notes)?x.notes:[]}}catch(e){return freshState()}}
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){throw new Error('The browser could not save the data. Check whether site storage is disabled or full.')}}
function readHide(){try{return localStorage.getItem('financial-floor-hide')==='1'}catch(e){return false}}
function saveHide(){try{localStorage.setItem('financial-floor-hide',hide?'1':'0')}catch(e){}}
const m=n=>hide?'₦ ••••••':N(n);
const uid=()=>Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9);
const when=t=>new Date(t).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
function monthStart(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),1).getTime()}
function monthlySpent(key){const start=monthStart();return state.ledger.filter(e=>e.bucket===key&&e.type==='spend'&&e.t>=start).reduce((s,e)=>s+Math.abs(Number(e.amount)||0),0)}
function calc(){const b={floor:0};getWallets().forEach(w=>b[w.key]=0);for(const e of state.ledger){if(Object.prototype.hasOwnProperty.call(b,e.bucket))b[e.bucket]+=Number(e.amount)||0}const approved=state.requests.filter(r=>r.status==='approved').reduce((s,r)=>s+(Number(r.amount)||0),0);const refillDue=Math.max(0,approved-state.ledger.filter(e=>e.refill).reduce((s,e)=>s+(Number(e.amount)||0),0));const sp=getWallets().reduce((s,w)=>s+(b[w.key]||0),0);return{b,refillDue,sp,total:b.floor+sp}}
function split(amount,pct){const{b,refillDue}=calc(),target=state.cfg.bareBones*state.cfg.targetDays;let f=0,refill=0;if(refillDue>0){refill=Math.min(amount,refillDue);f=refill}else if(b.floor<target){f=Math.min(Math.round(amount*pct/100),target-b.floor)}const rest=amount-f,out={floor:f,refill};const def=DEFAULT_WALLETS;let used=0;def.forEach((w,i)=>{const key=w.key;out[key]=i===def.length-1?rest-used:Math.round(rest*(state.cfg.splits[key]||0)/100);used+=out[key]||0});getWallets().forEach(w=>{if(!out.hasOwnProperty(w.key))out[w.key]=0});return out}
function stat(days){return days>=180?'180-day floor reached':days>=90?'90 days held, building to 180':days>=30?'30 days held, building to 90':days>=7?'7 days held, building to 30':'Below your 7-day seed floor'}
function lab(e){if(e.type==='in')return e.refill?'Floor refill':'Added to '+e.bucket;if(e.type==='spend')return'Spent: '+(e.note||e.bucket);if(e.type==='release')return'Floor released: '+(e.note||e.bucket);if(e.type==='move')return e.amount<0?`${cap(e.bucket)} transfer out`:`${cap(e.bucket)} transfer in`;return cap(e.bucket)+' '+(e.note||'activity')}
function row(e){const positive=e.amount>0;const symbol=e.type==='move'?'arrow-left-right':positive?'arrow-down-left':'arrow-up-right';return`<div class="rw"><span class="ci">${ic(symbol)}</span><span class="g"><b>${esc(lab(e))}</b><small>${esc(cap(e.bucket))} · ${when(e.t)}${e.note&&e.type!=='spend'&&e.type!=='move'?' · '+esc(e.note):''}</small></span><b class="${positive?'pos':'neg'}">${positive?'+':'−'}${N(Math.abs(e.amount))}</b></div>`}
function addNote(text){state.notes.unshift({id:uid(),text,t:Date.now(),read:false});if(state.notes.length>300)state.notes.length=300}
function addLedger(entries){const now=Date.now();for(const e of entries){if(!e.amount)continue;state.ledger.unshift({id:uid(),...e,t:now})}if(state.ledger.length>3000)state.ledger.length=3000}
function saveAndRender(msg){persist();render();if(msg)toast(msg)}
function budgetBar(key){const spent=monthlySpent(key),budget=getBudget(key);if(!budget)return'';const pct=Math.min(100,Math.round(spent/budget*100));const cls=pct>=100?'over':pct>=80?'warn':'';return`<div class="budget-bar"><div class="budget-label"><span>This month</span><span>${N(spent)} / ${N(budget)}</span></div><div class="bar ${cls}"><i style="width:${pct}%"></i></div></div>`}
function donutSVG(data,total){if(!total)return'<div class="donut" style="background:var(--ls);border-radius:50%"></div>';let acc=0;const colors=['#C65316','#F47738','#E8A317','#17865B','#6B5B95','#88B04B'];const segs=data.map((d,i)=>{const p=d.value/total;const start=acc;acc+=p;return{...d,start,end:acc,color:colors[i%colors.length]}});const r=46,cx=60,cy=60;const arcs=segs.map(s=>{const a1=s.start*2*Math.PI-Math.PI/2,a2=s.end*2*Math.PI-Math.PI/2;const x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);const large=s.end-s.start>0.5?1:0;return`<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} Z" fill="${s.color}"/>`}).join('');return`<svg class="donut" viewBox="0 0 120 120">${arcs}<circle cx="60" cy="60" r="28" fill="var(--sf)"/></svg>`}
function vHome(){const{b,sp,total,refillDue}=calc(),days=Math.floor(b.floor/(state.cfg.bareBones||1)),pct=Math.min(100,Math.round(b.floor/(state.cfg.bareBones*state.cfg.targetDays)*100));const wallets=getWallets();return`<div class="top"><div class="lg">${state.profile?.picture?`<img class="avatar" src="${esc(state.profile.picture)}" alt="">`:'FF'}</div><div class="g"><b>${esc(state.profile?.name||'Financial Floor')}</b><small>${esc(stat(days))}</small></div><button class="ib" data-n aria-label="Notifications">${ic('bell')}${state.notes.some(n=>!n.read)?'<span class="bd"></span>':''}</button></div>

<div class="sh2"><b>Quick actions</b></div><div class="qa"><button data-a="in">${ic('plus','ci')}<span>Add money</span></button><button data-a="spend">${ic('minus','ci')}<span>Spend</span></button><button data-a="move">${ic('arrow-left-right','ci')}<span>Move</span></button><button data-a="rel">${ic('shield','ci')}<span>Release</span></button></div>
<div class="sh2"><b>Wallets</b><button data-v="wallets">See all</button></div><div class="wg">${wallets.slice(0,3).map(w=>`<button data-w="${w.key}">${ic(w.icon,'ci')}<b>${m(b[w.key]||0)}</b><span>${esc(w.name)}</span></button>`).join('')}</div>

<div class="c"><div class="lb">Floor</div><div class="fd"><b>${m(b.floor)}</b></div><p class="mu">Protected money. Use Release to request access.</p><button class="go s" data-a="rel">Request release</button></div>`}
function vActivity(){const wallets=getWallets();const start=monthStart();const monthSpends=state.ledger.filter(e=>e.type==='spend'&&e.t>=start);const byWallet={};monthSpends.forEach(e=>{byWallet[e.bucket]=(byWallet[e.bucket]||0)+Math.abs(e.amount)});const data=Object.entries(byWallet).map(([k,v])=>({key:k,name:getWallet(k).name,value:v})).sort((a,b)=>b.value-a.value);const totalMonth=data.reduce((s,d)=>s+d.value,0);const es=state.ledger.filter(e=>filt==='all'||(filt==='floor'?e.bucket==='floor':e.bucket===filt));return`<h1>Activity</h1><p class="mu">A record of additions, spending, transfers and floor activity.</p>

<div class="chips">${['all','floor',...wallets.map(w=>w.key)].map(f=>`<button type="button" data-f="${f}" class="${filt===f?'on':''}">${f==='all'?'All activity':f==='floor'?'Floor':getWallet(f).name}</button>`).join('')}</div>${es.map(row).join('')||'<div class="empty">No matching transactions yet.</div>'}

function reqH(r){const waiting=r.status==='waiting',ready=waiting&&Date.now()>=r.releaseAt;return`<div class="q"><b>${N(r.amount)} · ${esc(r.reason)}</b><br><span class="mu">${esc(r.note||'')} · ${r.status}${waiting?` · ready ${when(r.releaseAt)}`:''}</span>${waiting?`<div>${ready?'<button data-act="approved" data-id="'+r.id+'">Approve</button>':''}<button data-act="denied" data-id="${r.id}">Deny</button><button data-act="cancelled" data-id="${r.id}">Cancel</button></div>`:''}</div>`}

return`<div class="top"><div class="lg">${p.picture?`<img class="avatar" src="${esc(p.picture)}" alt="">`:esc((p.name||'F')[0])}</div><div class="g"><b>${esc(p.name)}</b><small>Profile</small></div></div>

function isProfileComplete(){const p=state.profile;if(!p)return false;return !!(p.name&&p.email&&p.state&&p.dob&&p.phone&&p.sourceOfIncome&&p.salaryRange&&p.address)}
function render(){const app=$('#app');if(!isProfileComplete()&&!editingProfile){app.innerHTML=vProfile();$('#nav').hidden=true;icons();return}$('#nav').hidden=false;$('#nav').innerHTML=NAV.map(([k,i,l])=>`<button data-v="${k}" class="${view===k?'on':''}">${ic(i)}<span>${l}</span></button>`).join('');app.innerHTML=V[view]?V[view]():'';icons()}
function toast(t){const el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display='none',2800)}
function sheet(title,html,onOpen){modalKind=title;$('#ov').innerHTML=`<div class="sh"><div class="hd"><span>${esc(title)}</span><button type="button" id="closeSheet" aria-label="Close">${ic('x')}</button></div>${html}</div>`;$('#closeSheet').onclick=closeSheet;if(onOpen)onOpen();icons()}
function closeSheet(){modalKind=null;$('#ov').innerHTML=''}
function fail(msg){const m=$('.msg');if(m){m.textContent=msg;m.className='msg bad'}else toast(msg)}
const amountField='<label for="a">Amount (₦)</label><input id="a" type="number" min="1" step="1" inputmode="numeric" required>';
function readAmount(){const v=Number($('#a').value);if(!Number.isSafeInteger(v)||v<=0)throw new Error('Enter a positive whole naira amount.');return v}
function wsel(id,sel){return`<select id="${id}">${getWallets().map(w=>`<option value="${w.key}" ${w.key===sel?'selected':''}>${esc(w.name)}</option>`).join('')}</select>`}
function recentNotes(){const s=new Set();state.ledger.filter(e=>e.type==='spend'&&e.note).slice(0,20).forEach(e=>s.add(e.note));return[...s].slice(0,6)}
function finish(text){persist();closeSheet();render();toast(text)}
function actionForm(k,p){
 if(k==='in'){sheet('Add money',amountField+`<label for="fp">Floor share (%)</label><input id="fp" type="number" min="0" max="100" step="1" value="${state.cfg.floorPct}"><label for="n">Note (optional)</label><input id="n" maxlength="60" placeholder="e.g. money received"><div class="pv" id="pv"></div><button type="button" class="go" id="go">Add money</button>`,()=>{const pv=()=>{const a=Number($('#a').value)||0,fp=Math.min(100,Math.max(0,Number($('#fp').value)||0)),s=a>0?split(a,fp):null;$('#pv').innerHTML=s?`<div><span>Floor${s.refill?' (refill)':''}</span><b>${N(s.floor)}</b></div>`+DEFAULT_WALLETS.map(w=>`<div><span>${esc(w.name)}</span><b>${N(s[w.key]||0)}</b></div>`).join(''):''};$('#a').oninput=pv;$('#fp').oninput=pv;$('#go').onclick=()=>{try{const a=readAmount(),f=Number($('#fp').value);if(!Number.isFinite(f)||f<0||f>100)throw new Error('Floor share must be between 0 and 100.');const s=split(a,f),n=$('#n').value.trim();addLedger([{type:'in',bucket:'floor',amount:s.floor,refill:s.refill>0,note:n},...DEFAULT_WALLETS.map(w=>({type:'in',bucket:w.key,amount:s[w.key]||0,note:n}))]);addNote(`You added ${N(a)}: ${N(s.floor)} to your floor and ${N(a-s.floor)} across your wallets.`);finish(`Added ${N(a)} to your tracked funds.`)}catch(e){fail(e.message)}}});return}
 if(k==='spend'){const notes=recentNotes();const chips=notes.length?`<div class="quick-chips">${notes.map(n=>`<button type="button" data-note="${esc(n)}">${esc(n)}</button>`).join('')}</div>`:'';sheet('Spend',`<label for="w1">Wallet</label>${wsel('w1',p||getWallets()[0]?.key)}${amountField}<label for="n">What was it for?</label>${chips}<input id="n" maxlength="60" placeholder="e.g. groceries"><button type="button" class="go" id="go">Log spend</button>`,()=>{document.querySelectorAll('[data-note]').forEach(btn=>btn.onclick=()=>{$('#n').value=btn.dataset.note});$('#go').onclick=()=>{try{const a=readAmount(),w=$('#w1').value,n=$('#n').value.trim(),{b}=calc();if(!n)throw new Error('Describe what the expense was for.');if(a>b[w])throw new Error(`${getWallet(w).name} has only ${N(b[w])}. Move money into this wallet first.`);addLedger([{type:'spend',bucket:w,amount:-a,note:n}]);addNote(`${N(a)} spent from your ${getWallet(w).name} wallet for ${n}.`);finish(`Logged ${N(a)} from ${getWallet(w).name}.`)}catch(e){fail(e.message)}}});return}
 if(k==='move'){const wallets=getWallets();sheet('Move money',`<div class="row"><div><label for="w1">From</label>${wsel('w1',p||wallets[0]?.key)}</div><div><label for="w2">To</label>${wsel('w2',wallets.find(w=>w.key!==(p||wallets[0]?.key))?.key||wallets[1]?.key)}</div></div>${amountField}<p class="mu">The protected floor is not a transfer source. Use Release floor for a floor release.</p><button type="button" class="go" id="go">Move money</button>`,()=>{$('#go').onclick=()=>{try{const a=readAmount(),f=$('#w1').value,t=$('#w2').value,{b}=calc();if(f===t)throw new Error('Choose two different wallets.');if(a>b[f])throw new Error(`${getWallet(f).name} has only ${N(b[f])}.`);addLedger([{type:'move',bucket:f,amount:-a,note:'to '+getWallet(t).name},{type:'move',bucket:t,amount:a,note:'from '+getWallet(f).name}]);addNote(`${N(a)} moved from ${getWallet(f).name} to ${getWallet(t).name}.`);finish(`Moved ${N(a)} from ${getWallet(f).name} to ${getWallet(t).name}.`)}catch(e){fail(e.message)}}});return}
 if(k==='addwallet'){sheet('Create new wallet',`<label for="wn">Wallet name</label><input id="wn" maxlength="30" placeholder="e.g. Savings, Rent, Fun" required><label for="wi">Icon</label><select id="wi">${WALLET_ICONS.map(i=>`<option value="${i}">${i.replace(/-/g,' ')}</option>`).join('')}</select><button type="button" class="go" id="go">Create wallet</button>`,()=>{$('#go').onclick=()=>{try{const name=$('#wn').value.trim();if(!name)throw new Error('Enter a name for the wallet.');const icon=$('#wi').value||'wallet';const key=name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||uid();if(getWallets().some(w=>w.key===key))throw new Error('A wallet with a similar name already exists.');state.wallets=getWallets();state.wallets.push({key,name,icon});persist();closeSheet();toast(`Wallet “${name}” created.`);setTimeout(()=>actionForm('move',key),300)}catch(e){fail(e.message)}}});return}
 if(k==='manage'){const w=getWallet(p);sheet('Manage '+w.name,`<label for="rn">Rename</label><input id="rn" maxlength="30" value="${esc(w.name)}"><label for="ri">Change icon</label><select id="ri">${WALLET_ICONS.map(i=>`<option value="${i}" ${i===w.icon?'selected':''}>${i.replace(/-/g,' ')}</option>`).join('')}</select><label for="bud">Monthly budget (₦, optional)</label><input id="bud" type="number" min="0" step="1" value="${getBudget(p)||''}" placeholder="0 = no budget"><div class="row"><button type="button" class="go" id="saveM">Save changes</button></div><button type="button" class="go danger" id="delM">Delete wallet</button>`,()=>{$('#saveM').onclick=()=>{try{const name=$('#rn').value.trim();if(!name)throw new Error('Name cannot be empty.');const icon=$('#ri').value;const bud=Number($('#bud').value)||0;if(bud<0)throw new Error('Budget cannot be negative.');const idx=state.wallets.findIndex(x=>x.key===p);if(idx>=0){state.wallets[idx].name=name;state.wallets[idx].icon=icon}if(!state.budgets)state.budgets={};if(bud>0)state.budgets[p]=bud;else delete state.budgets[p];finish('Wallet updated.')}catch(e){fail(e.message)}};$('#delM').onclick=()=>{if(!confirm(`Delete “${w.name}”? Its history stays, but the wallet will be removed from the list.`))return;state.wallets=state.wallets.filter(x=>x.key!==p);if(state.budgets)delete state.budgets[p];if(wd===p)wd=null;finish('Wallet deleted.')}});return}
 if(k==='rel'){sheet('Release floor',`<p class="mu">Floor releases are for essential needs such as food, shelter, or medical expenses. Your balance stays unchanged while the request is waiting. In personal mode, you can approve an eligible request after its waiting period.</p>${amountField}<label for="r">Reason</label><select id="r"><option>Food</option><option>Shelter</option><option>Medical</option><option>Other</option></select><label for="n">Describe the need</label><input id="n" maxlength="80" placeholder="Briefly explain the expense"><button type="button" class="go" id="go">Request release</button>`,()=>{$('#go').onclick=()=>{try{const a=readAmount(),reason=$('#r').value,n=$('#n').value.trim(),{b}=calc();if(a>b.floor)throw new Error(`The floor holds only ${N(b.floor)}.`);if(!n)throw new Error('Describe why you need the release.');const blocked=reason==='Other'||BAD.test(n),t=Date.now(),r={id:uid(),amount:a,reason,note:n,createdAt:t,releaseAt:t+Math.max(0,Number(state.cfg.waitHours)||0)*36e5,status:blocked?'blocked':'waiting'};state.requests.unshift(r);addNote(blocked?`Your floor release request for ${N(a)} was blocked. Use an eligible essential-expense reason.`:`Your floor release request for ${N(a)} was recorded. It is waiting for approval; your floor has not changed.`);if(blocked){persist();render();closeSheet();toast('Request blocked by the floor rules.')}else finish('Release request recorded.')}catch(e){fail(e.message)}}});return}
 if(k==='count'){sheet('Reconcile balances',`<p class="mu">Compare the total in your actual accounts with the total tracked here. This check creates a note; it does not change balances.</p><label for="a">Actual total across your accounts (₦)</label><input id="a" type="number" min="0" step="1" inputmode="numeric" placeholder="0"><button type="button" class="go" id="go">Compare totals</button>`,()=>{$('#go').onclick=()=>{try{const raw=$('#a').value;if(raw===''||!Number.isSafeInteger(Number(raw))||Number(raw)<0)throw new Error('Enter a valid total of zero or more.');const{total}=calc(),diff=Number(raw)-total,msg=diff===0?'Reconciled: your actual total matches the ledger.':diff<0?`Reconciliation: ${N(-diff)} less than the ledger is in your actual accounts.`:`Reconciliation: your actual accounts contain ${N(diff)} more than the ledger.`;addNote(msg);finish(msg)}catch(e){fail(e.message)}}});return}
 if(k==='set'){const c=state.cfg;sheet('Floor settings',`<label for="s_bb">Bare-bones cost per day (₦)</label><input id="s_bb" type="number" min="1" step="1" value="${c.bareBones}"><div class="row"><div><label for="s_td">Floor target (days)</label><input id="s_td" type="number" min="7" step="1" value="${c.targetDays}"></div><div><label for="s_fp">Floor share (%)</label><input id="s_fp" type="number" min="0" max="100" step="1" value="${c.floorPct}"></div></div><label for="s_wh">Release waiting period (hours)</label><input id="s_wh" type="number" min="0" step="0.5" value="${c.waitHours}"><p class="mu">Set to 0 to remove the waiting period in this personal tracker. Eligible release requests still require approval.</p><label>Wallet split of the amount not allocated to the floor (must total 100%)</label><div class="row">${DEFAULT_WALLETS.map(w=>`<div><label for="s_${w.key}" style="margin-top:4px">${esc(w.name)} (%)</label><input id="s_${w.key}" type="number" min="0" max="100" step="1" value="${c.splits[w.key]||0}"></div>`).join('')}</div><label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input id="s_solo" type="checkbox" ${c.solo?'checked':''}> Allow personal approval of my own eligible floor releases</label><p class="subtle">This is a personal tracker, not independent financial approval. Keep the waiting period if you want a pause before releasing protected money.</p><button type="button" class="go" id="go">Save settings</button>`,()=>{$('#go').onclick=()=>{try{const bareBones=Number($('#s_bb').value),targetDays=Number($('#s_td').value),floorPct=Number($('#s_fp').value),waitHours=Number($('#s_wh').value),splits={};DEFAULT_WALLETS.forEach(w=>splits[w.key]=Number($('#s_'+w.key).value));if(!Number.isSafeInteger(bareBones)||bareBones<=0)throw new Error('Daily cost must be a positive whole naira amount.');if(!Number.isSafeInteger(targetDays)||targetDays<7||targetDays>3650)throw new Error('Target days must be between 7 and 3650.');if(!Number.isFinite(floorPct)||floorPct<0||floorPct>100)throw new Error('Floor share must be between 0 and 100.');if(!Number.isFinite(waitHours)||waitHours<0||waitHours>8760)throw new Error('Waiting period must be between 0 and 8760 hours.');if(DEFAULT_WALLETS.some(w=>!Number.isSafeInteger(splits[w.key])||splits[w.key]<0||splits[w.key]>100)||DEFAULT_WALLETS.reduce((s,w)=>s+splits[w.key],0)!==100)throw new Error('Wallet splits must be whole percentages that add up to 100.');state.cfg={bareBones,targetDays,floorPct,waitHours,splits,solo:$('#s_solo').checked};addNote('Your financial floor settings were updated.');finish('Settings saved.')}catch(e){fail(e.message)}}});return}
 if(k==='export'){exportBackup();return}
 if(k==='import'){importBackup();return}
 if(k==='reset'){sheet('Reset app data',`<div class="warn">This permanently deletes the financial data saved by this app in this browser. Export a backup first if you may need it later.</div><label for="confirmReset">Type RESET to confirm</label><input id="confirmReset" autocomplete="off"><button type="button" class="go" id="go">Delete local data</button>`,()=>{$('#go').onclick=()=>{if($('#confirmReset').value!=='RESET'){fail('Type RESET exactly to confirm.');return}try{localStorage.removeItem(STORAGE_KEY);localStorage.removeItem(WELCOME_CONFIRMED_KEY);state=freshState();view='home';wd=null;sel=null;editingProfile=false;confirmProfileOnThisVersion=false;closeSheet();render();toast('Local app data reset.')}catch(e){fail(e.message)}}});return}
}
function notifs(){const unread=state.notes.filter(n=>!n.read).length;sheet('Notifications',`<div class="row" style="align-items:center;margin:8px 0 3px"><span class="mu">${unread} unread</span>${unread?'<button type="button" class="go s" style="margin:0" id="ma">Mark all as read</button>':''}</div>${state.notes.slice(0,50).map(n=>`<button type="button" class="nt ${n.read?'':'u'}" data-r="${n.id}"><span class="d"></span><span>${esc(n.text)}<br><small class="mu">${when(n.t)}</small></span></button>`).join('')||'<div class="empty">No notifications yet. They will appear after financial activity.</div>'}`,()=>{const b=$('#ma');if(b)b.onclick=()=>{state.notes.forEach(n=>n.read=true);persist();notifs();render()}})}
function exportBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='financial-floor-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('Backup exported.')}
function importBackup(){sheet('Import backup',`<p class="mu">Choose a JSON backup previously exported by Financial Floor. Importing replaces the data currently stored in this browser.</p><label for="backupFile">Backup file</label><input id="backupFile" type="file" accept="application/json,.json"><button type="button" class="go" id="go">Import data</button>`,()=>{$('#go').onclick=async()=>{try{const file=$('#backupFile').files?.[0];if(!file)throw new Error('Choose a backup file first.');const data=JSON.parse(await file.text());if(!data||!Array.isArray(data.ledger)||!Array.isArray(data.notes)||!Array.isArray(data.requests)||!data.cfg)throw new Error('This does not look like a valid Financial Floor backup.');state={...freshState(),...data,profile:data.profile||null,wallets:data.wallets||DEFAULT_WALLETS,budgets:data.budgets||{},cfg:{...DEFAULT_CFG,...data.cfg,splits:{...DEFAULT_CFG.splits,...(data.cfg.splits||{})}},ledger:data.ledger,notes:data.notes,requests:data.requests};persist();view='home';wd=null;closeSheet();render();toast('Backup imported.')}catch(e){fail(e.message)}}})}
document.addEventListener('click',e=>{const c=s=>e.target.closest(s);let x;if(c('#eye')){hide=!hide;saveHide();render()}else if(x=c('[data-v]')){view=x.dataset.v;wd=null;render();window.scrollTo(0,0)}else if(x=c('[data-w]')){view='wallets';wd=x.dataset.w||null;render();window.scrollTo(0,0)}else if(x=c('[data-ms]')){sel=Number(x.dataset.ms);view='home';wd=null;render()}else if(x=c('[data-f]')){filt=x.dataset.f;render()}else if(c('[data-n]'))notifs();else if(x=c('[data-a]'))actionForm(x.dataset.a,x.dataset.p);else if(x=c('[data-r]')){const n=state.notes.find(n=>n.id===x.dataset.r);if(n)n.read=true;persist();notifs();render()}else if(x=c('[data-act]')){const r=state.requests.find(r=>r.id===x.dataset.id);if(!r||r.status!=='waiting')return;if(x.dataset.act==='approved'&&Date.now()<r.releaseAt){toast('This request is still within its waiting period.');return}if(x.dataset.act==='approved'&&r.amount>calc().b.floor){toast('The floor no longer has enough money to approve this request.');return}const labels={approved:'approved',denied:'denied',cancelled:'cancelled'};r.status=x.dataset.act;r.decidedAt=Date.now();if(r.status==='approved'){addLedger([{type:'release',bucket:'floor',amount:-r.amount,note:r.reason+(r.note?': '+r.note:'')}])}addNote(`Your floor release request of ${N(r.amount)} was ${labels[r.status]}.`);try{persist();render();toast(`Release request ${labels[r.status]}.`)}catch(err){toast(err.message)}}else if(c('[data-edit-profile]')){editingProfile=true;render();const input=$('#nm');if(input){input.focus();input.select()}}else if(c('[data-theme-toggle]')){theme=theme==='dark'?'light':'dark';localStorage.setItem(THEME_KEY,theme);document.documentElement.setAttribute('data-theme',theme);render()}});
document.addEventListener('submit',e=>{if(e.target.id==='welcomeForm'){e.preventDefault();const name=$('#nm').value.trim();const email=$('#em').value.trim();const phone=$('#ph').value.trim();const dob=$('#dob').value;const st=$('#st').value;const address=$('#ad').value.trim();const source=$('#so').value;const salary=$('#sr').value;if(!name||!email||!phone||!dob||!st||!address||!source||!salary){toast('Please fill in all required fields.');return}const picture=window._pendingPicture||state.profile?.picture||'';state.profile={name,email,phone,dob,state:st,address,sourceOfIncome:source,salaryRange:salary,picture};try{persist();editingProfile=false;confirmProfileOnThisVersion=false;try{localStorage.setItem(WELCOME_CONFIRMED_KEY,'1')}catch(_){}delete window._pendingPicture;view='home';render();toast('Profile saved. Welcome to Financial Floor.');}catch(err){toast(err.message)}}});
document.addEventListener('click',e=>{if(e.target.closest('#cancelProfileEdit')){editingProfile=false;confirmProfileOnThisVersion=false;view='profile';render();return}});
window.addEventListener('storage',e=>{if(e.key===STORAGE_KEY){state=loadState();render()}});
setInterval(()=>{if(!modalKind&&state.profile?.name){render()}},60000);
try {
  void localStorage.getItem(STORAGE_KEY);
  render();
  loadImported();
} catch (e) {
  console.error(e);
  document.getElementById('app').innerHTML = '<div class="c"><h1>Something went wrong</h1><p class="mu">Check the console for details.</p></div>';
}
document.addEventListener('click', e => {
  if (e.target.id === 'refreshImported') loadImported();
});
</script>
</body>
